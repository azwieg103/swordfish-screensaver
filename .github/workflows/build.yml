name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y cmake g++ libsdl2-dev libgl-dev
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build --parallel
      - name: Upload executable
        uses: actions/upload-artifact@v4
        with:
          name: swordfish-linux
          path: build/swordfish-screensaver

  windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: Install SDL2
        run: vcpkg install sdl2:x64-windows
      - name: Configure
        shell: pwsh
        run: cmake -S . -B build -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake" -DVCPKG_TARGET_TRIPLET=x64-windows
      - name: Build
        run: cmake --build build --config Release
      - name: Package Windows ZIP
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item build/Release/swordfish-screensaver.exe dist/
          $dll = Get-ChildItem "$env:VCPKG_INSTALLATION_ROOT/installed/x64-windows/bin/SDL2.dll" -ErrorAction SilentlyContinue
          if ($dll) { Copy-Item $dll.FullName dist/ }
          Copy-Item README.md, LICENSE dist/
          Compress-Archive -Path dist/* -DestinationPath swordfish-windows-x64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: swordfish-windows-x64
          path: swordfish-windows-x64.zip

  almalinux10-rpm:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Build RPM in AlmaLinux 10 container
        run: |
          docker run --rm -v "$PWD:/src:ro" -v "$RUNNER_TEMP/rpms:/rpms" almalinux:10 bash -euxc '
            dnf install -y rpm-build rpmdevtools cmake gcc-c++ make SDL2-devel mesa-libGL-devel tar gzip
            useradd -m builder
            mkdir -p /home/builder/rpmbuild/{BUILD,BUILDROOT,RPMS,SOURCES,SPECS,SRPMS}
            tar -czf /home/builder/rpmbuild/SOURCES/swordfish-screensaver-0.1.0.tar.gz --transform="s,^,swordfish-screensaver-0.1.0/," -C /src .
            cp /src/packaging/swordfish-screensaver.spec /home/builder/rpmbuild/SPECS/
            rpmbuild -ba /home/builder/rpmbuild/SPECS/swordfish-screensaver.spec
            mkdir -p /rpms
            cp /home/builder/rpmbuild/RPMS/*/*.rpm /rpms/
          '
      - uses: actions/upload-artifact@v4
        with:
          name: swordfish-almalinux10-rpms
          path: ${{ runner.temp }}/rpms/*.rpm
