name: Build

on:
  push:
    tags:
      - "v*"
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y cmake g++ git libgl-dev libx11-dev libxext-dev libxrandr-dev libxrender-dev libxfixes-dev libxi-dev libxcursor-dev libxinerama-dev
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build --parallel
      - name: Test animation engine
        run: ctest --test-dir build --output-on-failure
      - name: Smoke test
        run: ./build/swordfish-screensaver --help
      - uses: actions/upload-artifact@v4
        with:
          name: swordfish-linux
          path: build/swordfish-screensaver

  windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: Install SDL2
        run: vcpkg install
      - name: Configure
        shell: pwsh
        run: cmake -S . -B build -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake" -DVCPKG_TARGET_TRIPLET=x64-windows
      - name: Build
        run: cmake --build build --config Release
      - name: Test animation engine
        run: ctest --test-dir build -C Release --output-on-failure
      - name: Smoke test
        run: .\build\Release\swordfish-screensaver.exe --help
      - name: Package Windows ZIP
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item build/Release/swordfish-screensaver.exe dist/
          Copy-Item build/Release/SDL2.dll dist/
          Copy-Item README.md, LICENSE dist/
          Compress-Archive -Path dist/* -DestinationPath swordfish-windows-x64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: swordfish-windows-x64
          path: swordfish-windows-x64.zip

  almalinux10-rpm:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Build RPM in AlmaLinux 10 container
        run: |
          mkdir -p "$RUNNER_TEMP/rpms"
          docker run --rm -v "$PWD:/src:ro" -v "$RUNNER_TEMP/rpms:/rpms" almalinux:10 bash -euxc '
            dnf install -y rpm-build cmake gcc-c++ git make mesa-libGL-devel libX11-devel libXext-devel libXrandr-devel libXrender-devel libXfixes-devel libXi-devel libXcursor-devel libXinerama-devel tar gzip
            useradd -m builder
            mkdir -p /home/builder/rpmbuild/{BUILD,BUILDROOT,RPMS,SOURCES,SPECS,SRPMS}
            tar --exclude=.git --exclude=build --exclude=dist -czf /home/builder/rpmbuild/SOURCES/swordfish-screensaver-0.2.1.tar.gz --transform="s,^,swordfish-screensaver-0.2.1/," -C /src .
            cp /src/packaging/swordfish-screensaver.spec /home/builder/rpmbuild/SPECS/
            chown -R builder:builder /home/builder/rpmbuild
            runuser -u builder -- rpmbuild -ba /home/builder/rpmbuild/SPECS/swordfish-screensaver.spec
            cp /home/builder/rpmbuild/RPMS/x86_64/*.rpm /rpms/
          '
      - uses: actions/upload-artifact@v4
        with:
          name: swordfish-almalinux10-rpms
          path: ${{ runner.temp }}/rpms/*.rpm

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [linux, windows, almalinux10-rpm]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: swordfish-*
          path: release-assets
          merge-multiple: true
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            release-assets/swordfish-linux
            release-assets/swordfish-windows-x64.zip
            release-assets/swordfish-screensaver-0.2.1-*.el10.x86_64.rpm
            release-assets/swordfish-screensaver-0.2.1-*.el10.src.rpm
